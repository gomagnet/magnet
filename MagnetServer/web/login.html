<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Sign in · Magnet</title><link rel="icon" type="image/png" href="/magnet-icon.png"><link rel="apple-touch-icon" href="/magnet-icon.png"><link rel="stylesheet" href="/login.css"><link rel="stylesheet" href="/scrollbars.css"><script src="/scrollbars.js" defer></script><script src="/i18n.js" defer></script><script src="/login.js" defer></script></head>
<body><main class="login-card"><img class="brand-icon" src="/magnet-icon.png" alt="" width="40" height="40"><div class="eyebrow">WELCOME TO MAGNET</div><h1>Sign in</h1><form id="login-form"><label for="login-username">Username<input id="login-username" name="username" autocomplete="username" placeholder="Username" value="admin" required autofocus></label><label for="access-key">Password / access key<input id="access-key" name="key" type="password" autocomplete="current-password" placeholder="Paste your access key"></label><label for="login-code">Authenticator or recovery code<input id="login-code" name="code" autocomplete="one-time-code" placeholder="6-digit code or recovery code"></label><p id="login-error" class="error" role="alert"></p><button type="submit">Sign in <span aria-hidden="true">→</span></button></form><form id="login-mfa-form" hidden><p>Your provider sign-in succeeded. Complete your account’s authenticator verification.</p><label>Authenticator or recovery code<input name="code" autocomplete="one-time-code" required></label><p class="error" role="alert"></p><button type="submit">Verify and sign in →</button><p><a href="/login">Back to sign in</a></p></form><div id="login-providers" hidden></div><small>Private workspace · Secure Link connections</small></main></body></html>
